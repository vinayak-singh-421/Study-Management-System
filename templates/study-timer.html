<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Study Timer | Study Management</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>

    <div class="timer-page">

        <div class="timer-card">

            <div class="timer-header">

                <span class="timer-icon">
                    ⏱️
                </span>

                <h1>
                    Study Timer
                </h1>

                <p>
                    Focus on your studies and make every minute count.
                </p>

            </div>


            <div class="timer-display">

                <span id="timerMinutes">
                    25
                </span>

                <span>
                    :
                </span>

                <span id="timerSeconds">
                    00
                </span>

            </div>


            <div class="timer-status" id="timerStatus">

                Ready to study 📚

            </div>


            <div class="timer-presets" id="timerModeToggle">

                <button
                    onclick="setSessionType('study', this)"
                    class="timer-preset mode-preset active"
                    id="modeStudyBtn"
                >
                    📚 Study
                </button>

                <button
                    onclick="setSessionType('coding', this)"
                    class="timer-preset mode-preset"
                    id="modeCodingBtn"
                >
                    💻 Coding
                </button>

            </div>


            <div class="timer-presets">

                <button
                    onclick="setStudyTime(25, this)"
                    class="timer-preset duration-preset active"
                >
                    25 Min
                </button>

                <button
                    onclick="setStudyTime(45, this)"
                    class="timer-preset duration-preset"
                >
                    45 Min
                </button>

                <button
                    onclick="setStudyTime(60, this)"
                    class="timer-preset duration-preset"
                >
                    60 Min
                </button>

            </div>


            <div class="timer-actions">

                <button
                    onclick="startTimer()"
                    class="primary-btn"
                >
                    ▶ Start
                </button>

                <button
                    onclick="pauseTimer()"
                    class="secondary-btn"
                >
                    ⏸ Pause
                </button>

                <button
                    onclick="resetTimer()"
                    class="secondary-btn"
                >
                    ↻ Reset
                </button>

            </div>


            <div class="timer-info">

                <div>

                    <strong id="todayMinutes">
                        0
                    </strong>

                    <span>
                        Minutes Studied Today
                    </span>

                </div>

            </div>

        </div>

    </div>


    <script
        src="{{ url_for('static', filename='js/main.js') }}"
    ></script>

</body>

</html>
